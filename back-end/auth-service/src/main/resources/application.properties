server.port=8081
spring.application.name=auth-service

# Giá trị thật lấy từ biến môi trường (.env / docker-compose), không ghi vào git
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.autoconfigure.exclude=net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

# Dùng 'validate' để Flyway toàn quyền quản lý bảng, còn Hibernate chỉ kiểm tra Entity có khớp DB không
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# DB cũ đã có bảng do Hibernate tạo: coi là V1, không chạy lại script tạo bảng
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.seed.enabled=false

# Bắt buộc đặt JWT_SECRET (tối thiểu 32 ký tự): openssl rand -hex 32
application.jwt.secret-key=${JWT_SECRET}
application.jwt.access-token-expiration=900000
application.jwt.refresh-token-expiration=604800000

grpc.server.port=9091

spring.web.error.include-message=always
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always