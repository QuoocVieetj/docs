name: CI/CD

# Chạy trên mọi pull request (không lọc theo thư mục để luôn có đủ check khi bật branch protection)
on:
  pull_request:
  push:
    branches: [main]

# Push mới lên cùng branch thì hủy lần chạy cũ
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.service }}) - lint, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, category-service]
    defaults:
      run:
        working-directory: back-end/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: back-end/${{ matrix.service }}/pom.xml

      - name: Lint (Checkstyle)
        run: ./mvnw -B checkstyle:check

      # Test dùng H2 trong bộ nhớ (src/test/resources), không cần Postgres
      - name: Test
        run: ./mvnw -B test

      - name: Build
        run: ./mvnw -B package -DskipTests

  frontend:
    name: Frontend - lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - run: npm ci

      - name: Lint
        run: |
          npm run lint
          npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker (${{ matrix.image }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: auth-service
            context: back-end/auth-service
          - image: category-service
            context: back-end/category-service
          - image: front-end
            context: front-end
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # PR chỉ build thử Dockerfile; push vào main mới đẩy image lên GHCR
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # URL API của front-end nhúng vào bundle lúc build, đổi qua Settings > Variables nếu cần
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'http://localhost:8081/api' }}
            VITE_CATEGORY_API_URL=${{ vars.VITE_CATEGORY_API_URL || 'http://localhost:8080/api' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
