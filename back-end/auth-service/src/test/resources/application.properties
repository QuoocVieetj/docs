spring.application.name=auth-service
spring.autoconfigure.exclude=net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

# Test dùng H2 trong bộ nhớ, không cần Postgres
spring.datasource.url=jdbc:h2:mem:auth_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

app.seed.enabled=false

# Khóa chỉ dùng cho test
application.jwt.secret-key=test-only-secret-key-at-least-32-characters
application.jwt.access-token-expiration=900000
application.jwt.refresh-token-expiration=604800000

# Không mở cổng gRPC thật khi test (tránh trùng cổng 9091 với container đang chạy)
grpc.server.port=-1
grpc.server.in-process-name=auth-service-test
